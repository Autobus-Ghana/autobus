services:
  db:
    image: postgres:15-alpine
    container_name: autobus_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autobusadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autobus098}
      POSTGRES_DB: ${POSTGRES_DB:-autobus}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - autobus_network
  
  redis:
    image: redis:7-alpine
    container_name: autobus_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-autobus098} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - autobus_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: autobus_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@useautobus.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-autobus098}
      PGADMIN_CONFIG_SERVER_MODE: 'True'
      PGADMIN_CONFIG_PROXY_X_FOR_COUNT: '1'
      PGADMIN_CONFIG_PROXY_X_PROTO_COUNT: '1'
      PGADMIN_CONFIG_PROXY_X_HOST_COUNT: '1'
      PGADMIN_CONFIG_PROXY_X_PORT_COUNT: '1'
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - autobus_network
      - caddy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  portainer:
    image: portainer/portainer-ce:latest
    container_name: autobus_portainer
    restart: unless-stopped
    ports:
      - "127.0.0.1:9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - autobus_network
      - caddy

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autobus_backend
    restart: unless-stopped
    working_dir: /app
    command: bash startup.sh
    volumes:
      - .:/app
    environment:
      # PostgreSQL Environment Variables (for config.py)
      PGHOST: ${PGHOST:-db}
      PGPORT: ${PGPORT:-5432}
      PGUSER: ${PGUSER:-autobusadmin}
      PGPASSWORD: ${PGPASSWORD:-autobus098}
      PGDATABASE: ${PGDATABASE:-autobus}
      
      # SQLAlchemy Database URL (legacy support)
      SQLALCHEMY_DATABASE_URL: "postgresql://autobusadmin:autobus098@db:5432/autobus"
      
      # Redis Configuration
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-autobus098}
      
      # JWT Configuration (prefer JWT_SECRET_KEY from .env; default must be >= 32 bytes for HS256)
      SECRET_KEY: ${SECRET_KEY:-${JWT_SECRET_KEY:-09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7}}
      ALGORITHM: ${ALGORITHM:-HS256}
      KID: ${KID:-autobus-kid}
      
      # Application Configuration
      DEBUG: ${DEBUG:-false}
      DB_ECHO: ${DB_ECHO:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      
      # Message Queue Configuration (if needed)
      RABBIT_MQ_URL: ${RABBIT_MQ_URL:-}
      RABBIT_MQ_ROUTING_KEY: ${RABBIT_MQ_ROUTING_KEY:-}
      RABBIT_MQ_AUDIT_QUEUE: ${RABBIT_MQ_AUDIT_QUEUE:-}
      SMS_MQ_QUEUE: ${SMS_MQ_QUEUE:-}
      EMAIL_MQ_QUEUE: ${EMAIL_MQ_QUEUE:-}
      BATCH_CUSTOMER_UPLOAD_QUEUE: ${BATCH_CUSTOMER_UPLOAD_QUEUE:-}
      COMPANY_QUEUE: ${COMPANY_QUEUE:-}
      GREEN_ACCOUNT_URL: ${GREEN_ACCOUNT_URL:-}
      GREEN_ACCOUNT_API_KEY: ${GREEN_ACCOUNT_API_KEY:-}

      # Wirepick SMS Configuration
      WIREPICK_API_URL: "https://api.wirepick.com/httpsms"
      WIREPICK_PUBLIC_KEY: ${WIREPICK_PUBLIC_KEY:-8YyJoInAPwhngnjbD_5u5y2kC0CCvPnMk_F0cKLE3vc}
      WIREPICK_SENDER_ID: ${WIREPICK_SENDER_ID:-AutoBus}
      USE_WIREPICK_API_KEY: ${USE_WIREPICK_API_KEY:-true}

      # Zoho Zeptomail (OTP + customer email + email agent)
      ZEPTOMAIL_SMTP_HOST: ${ZEPTOMAIL_SMTP_HOST:-smtp.zeptomail.com}
      ZEPTOMAIL_SMTP_PORT: ${ZEPTOMAIL_SMTP_PORT:-587}
      ZEPTOMAIL_SMTP_USERNAME: ${ZEPTOMAIL_SMTP_USERNAME:-emailapikey}
      # Prefer dedicated SMTP password; fall back to API token (common Zeptomail setup).
      ZEPTOMAIL_SMTP_PASSWORD: ${ZEPTOMAIL_SMTP_PASSWORD:-${ZEPTOMAIL_API_TOKEN:-}}
      ZEPTOMAIL_API_TOKEN: ${ZEPTOMAIL_API_TOKEN:-}
      ZEPTOMAIL_FROM_EMAIL: ${ZEPTOMAIL_FROM_EMAIL:-}
      ZEPTOMAIL_SENDER_DOMAIN: ${ZEPTOMAIL_SENDER_DOMAIN:-useautobus.com}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-zeptomail}
      
      # Frontend and Other URLs
      BASE_FRONTEND_URL: ${BASE_FRONTEND_URL:-https://useautobus.com}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://useautobus.com,https://www.useautobus.com,https://admin.useautobus.com,http://localhost:8080,http://localhost:3000,http://localhost:4200}
      
      # OTP Configuration
      OTP_EXPIRE_MINUTES: ${OTP_EXPIRE_MINUTES:-5}
      OTP_EXPIRE_SECONDS: ${OTP_EXPIRE_SECONDS:-300}

      # Rate limiting (Redis fixed-window per client IP)
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_OTP_SEND: ${RATE_LIMIT_OTP_SEND:-5}
      RATE_LIMIT_AUTH_SIGNIN: ${RATE_LIMIT_AUTH_SIGNIN:-10}
      RATE_LIMIT_AUTH_SIGNUP: ${RATE_LIMIT_AUTH_SIGNUP:-5}
      RATE_LIMIT_AUTH_RESET: ${RATE_LIMIT_AUTH_RESET:-5}
      RATE_LIMIT_WEBHOOK_CHAT: ${RATE_LIMIT_WEBHOOK_CHAT:-60}
      RATE_LIMIT_AGENT: ${RATE_LIMIT_AGENT:-30}
      RATE_LIMIT_NLU: ${RATE_LIMIT_NLU:-40}
      RATE_LIMIT_GLOBAL: ${RATE_LIMIT_GLOBAL:-180}
      
      # MongoDB Configuration
      MONGO_URI: ${MONGO_URI:-mongodb://localhost:27017/}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-api_logs_db}
      
      # Auto Migration Flag
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}

      # Intervention / order event notifications (owner SMS + optional admin inbox)
      SMS_NOTIFICATION_ENABLED: ${SMS_NOTIFICATION_ENABLED:-true}
      ADMIN_NOTIFICATION_USER_IDS: ${ADMIN_NOTIFICATION_USER_IDS:-}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}

      # Language Model Configuration (OpenRouter: https://openrouter.ai/docs/quickstart)
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_HTTP_REFERER: ${LLM_HTTP_REFERER:-https://useautobus.com}
      LLM_APP_TITLE: ${LLM_APP_TITLE:-Autobus}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-120b}
      AUDIO_TRANSCRIPTION_MODEL: ${AUDIO_TRANSCRIPTION_MODEL:-}
      # Optional Groq fallback if OPENROUTER_API_KEY is unset.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-}

      # Google image (Nana Banana) + video (Veo) generation
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      NANA_BANANA_BASE_URL: ${NANA_BANANA_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      NANA_BANANA_MODEL: ${NANA_BANANA_MODEL:-}
      NANA_BANANA_USE_X_GOOG_API_KEY: ${NANA_BANANA_USE_X_GOOG_API_KEY:-false}
      VEO_GENERATE_URL: ${VEO_GENERATE_URL:-https://generativelanguage.googleapis.com/v1beta}
      VEO_MODEL: ${VEO_MODEL:-}
      VEO_USE_X_GOOG_API_KEY: ${VEO_USE_X_GOOG_API_KEY:-false}
      VEO_POLL_INTERVAL_SECONDS: ${VEO_POLL_INTERVAL_SECONDS:-10}
      VEO_MAX_POLL_SECONDS: ${VEO_MAX_POLL_SECONDS:-600}

      BLOTATO_API_KEY: ${BLOTATO_API_KEY:-your_blotato_api_key_here}
      BLOTATO_CLIENT_ID: ${BLOTATO_CLIENT_ID:-your_blotato_client_id_here}
      BLOTATO_CLIENT_SECRET: ${BLOTATO_CLIENT_SECRET:-your_blotato_client_secret_here}
      BLOTATO_REDIRECT_URI: ${BLOTATO_REDIRECT_URI:-https://api.useautobus.com/api/social/callback}

      CONTABO_ACCESS_KEY: ${CONTABO_ACCESS_KEY:-e59e33a21a72b214bfc6aeb3e2fcd711}
      CONTABO_SECRET_KEY: ${CONTABO_SECRET_KEY:-939a59165a7490c08e78311d26182118}
      CONTABO_BUCKET: ${CONTABO_BUCKET:-autobus}
      CONTABO_ENDPOINT: ${CONTABO_ENDPOINT:-https://usc1.contabostorage.com}

      # Postiz (self-hosted) integration
      # If Autobus shares a Docker network with Postiz, prefer service DNS:
      #   POSTIZ_BASE_URL=http://postiz:5000
      # If NOT sharing a Docker network, use host-mapped port (Docker Desktop):
      #   POSTIZ_BASE_URL=http://host.docker.internal:4007
      POSTIZ_BASE_URL: ${POSTIZ_BASE_URL:-http://postiz:5000}
      # Browser-facing Postiz URL used in authorization links.
      POSTIZ_PUBLIC_URL: ${POSTIZ_PUBLIC_URL:-https://postiz.useautobus.com}
      # Optional. Lets Autobus query TikTok creator_info with the stored Postiz token.
      POSTIZ_DATABASE_URL: ${POSTIZ_DATABASE_URL:-postgresql://postiz-user:postiz-password@postiz-postgres:5432/postiz-db-local}
      # Same TikTok app as Postiz. Used to refresh an expired access token before creator_info.
      TIKTOK_CLIENT_ID: ${TIKTOK_CLIENT_ID:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      # Postiz/Chatwoot LOCAL login: email + Autobus username (fullname), not the Autobus password.
      # When true, enables POST /api/v1/integrations/provision-self-test (destructive upstream).
      INTEGRATIONS_SELF_TEST_ENABLED: ${INTEGRATIONS_SELF_TEST_ENABLED:-false}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}

      # Chatwoot (self-hosted) integration (optional)
      # If shared network: CHATWOOT_BASE_URL=http://chatwoot_rails:3000
      # If not shared network (Docker Desktop): CHATWOOT_BASE_URL=http://host.docker.internal:3000
      CHATWOOT_BASE_URL: ${CHATWOOT_BASE_URL:-http://chatwoot_rails:3000}
      CHATWOOT_PLATFORM_API_TOKEN: ${CHATWOOT_PLATFORM_API_TOKEN:-}
      # Browser-facing Chatwoot URL for login / inbox setup links (falls back to CHATWOOT_BASE_URL in code if unset).
      CHATWOOT_PUBLIC_URL: ${CHATWOOT_PUBLIC_URL:-https://chatwoot.useautobus.com}
      # Optional: public origin of this API for Meta crawlers (Instagram publish) and webhook hints.
      AUTOBUS_PUBLIC_API_URL: ${AUTOBUS_PUBLIC_API_URL:-https://api.useautobus.com}

      # Self-hosted n8n (/var/www/n8n) on the shared caddy network; admin workflow builder only.
      N8N_BASE_URL: ${N8N_BASE_URL:-http://n8n:5678}
      N8N_API_KEY: ${N8N_API_KEY:-}
      N8N_PUBLIC_URL: ${N8N_PUBLIC_URL:-https://n8n.useautobus.com}

      # Meta WhatsApp Cloud API (webhook verify + outbound send / media)
      META_API_KEY: ${META_API_KEY:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_APP_ID: ${META_APP_ID:-2213025492844421}
      META_WHATSAPP_CONFIG_ID: ${META_WHATSAPP_CONFIG_ID:-1090469396641282}
      # Facebook Login for Business config for Postiz Page publishing (Digital Marketing).
      # Separate from META_WHATSAPP_CONFIG_ID (Embedded Signup).
      FACEBOOK_LOGIN_CONFIG_ID: ${FACEBOOK_LOGIN_CONFIG_ID:-2028376651182078}
      META_WHATSAPP_REDIRECT_URI: ${META_WHATSAPP_REDIRECT_URI:-https://useautobus.com/api/social/callback}
      # Instagram Business Login (API with Instagram Login) — app id differs from META_APP_ID
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID:-1370992838225688}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET:-}
      INSTAGRAM_REDIRECT_URI: ${INSTAGRAM_REDIRECT_URI:-https://useautobus.com/api/social/callback}
      INSTAGRAM_OAUTH_SCOPES: ${INSTAGRAM_OAUTH_SCOPES:-instagram_business_basic,instagram_business_manage_messages,instagram_business_manage_comments,instagram_business_content_publish,instagram_business_manage_insights}
      PUBLIC_WEBHOOK_API_KEY: ${PUBLIC_WEBHOOK_API_KEY:-}
      VERIFY_TOKEN: ${VERIFY_TOKEN:-}
      WHATSAPP_phone_ID: ${WHATSAPP_phone_ID:-}
      WHATSAPP_BUSINESS_ACCOUNT_ID: ${WHATSAPP_BUSINESS_ACCOUNT_ID:-}
      WHATSAPP_GRAPH_BASE_URL: ${WHATSAPP_GRAPH_BASE_URL:-https://graph.facebook.com/v25.0}
      WHATSAPP_REGISTER_PIN: ${WHATSAPP_REGISTER_PIN:-123456}

      # Qdrant RAG stack: use `http://greenbrain_rag_api:8088` when backend joins `greenbrain_rag`
      # (see `networks` below). Otherwise use a host-reachable URL, e.g.
      # `http://host.docker.internal:8088` if the RAG API port is published.
      RAG_SERVICE_URL: ${RAG_SERVICE_URL:-http://greenbrain_rag_api:8088}
      RAG_SERVICE_API_KEY: ${RAG_SERVICE_API_KEY:-}
      # Conversational chat always uses RAG when RAG_SERVICE_URL is set (see nlu.py).
      RAG_TENANT_MODE: ${RAG_TENANT_MODE:-company_then_user}
      RAG_USE_INTERNAL_USER_TENANT: ${RAG_USE_INTERNAL_USER_TENANT:-true}

      # Keep gunicorn RSS bounded on the shared 8GB VPS (see startup.sh).
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}

      # StoreKit 2. Sandbox/TestFlight receipts must not grant production credits.
      APPLE_BUNDLE_ID: ${APPLE_BUNDLE_ID:-com.autobus.app}
      APPLE_IAP_ALLOW_SANDBOX: ${APPLE_IAP_ALLOW_SANDBOX:-false}

    # Cap the API so a leak cannot take down Postgres/Redis/Caddy.
    mem_limit: 1536m

    ports:
      - "8000:8000"
    extra_hosts:
      # Ensure `host.docker.internal` resolves on Linux engines too.
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - autobus_network
      # Shared platform network (Caddy, Postiz, Chatwoot, RAG API)
      - caddy
      # RAG internal network (Qdrant, TEI, rag-api)
      - greenbrain_rag

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local
  portainer_data:
    driver: local

networks:
  autobus_network:
    driver: bridge
  caddy:
    external: true
    name: caddy
  greenbrain_rag:
    external: true
    name: greenbrain_rag
